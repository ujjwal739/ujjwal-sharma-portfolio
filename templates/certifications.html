{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h1 style="font-size:2.2rem;">My <span>Certifications</span></h1>
  <div style="margin-top:2rem; display:flex; flex-direction:column; gap:1rem;">
  {% for cert in certs %}
    <div style="border:1px solid var(--border); border-radius:6px; padding:1.2rem;">
      <strong>{{ cert['title'] }}</strong><br>
      <span style="color:var(--muted); font-size:0.9rem;">{{ cert['issuer'] }} — {{ cert['date_earned'] }}</span>
      {% if cert['file_name'] %}
        <br><a href="{{ url_for('static', filename='uploads/' + cert['file_name']) }}" target="_blank" style="color:var(--accent); font-size:0.9rem;">View Certificate</a>
      {% endif %}
    </div>
  {% else %}
    <p style="color:var(--muted);">Coming soon.</p>
  {% endfor %}
  </div>
</div>
{% endblock %}
