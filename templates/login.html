{% extends "base.html" %}
{% block content %}
<div class="hero" style="max-width:400px;">
  <h1 style="font-size:2rem;">Admin <span>Login</span></h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <p style="color:var(--accent); margin-top:1rem;">{{ messages[0] }}</p>
    {% endif %}
  {% endwith %}
  <form method="POST" style="margin-top:2rem; display:flex; flex-direction:column; gap:1rem;">
    <input type="text" name="username" placeholder="Username" required
      style="background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:0.8rem; border-radius:6px; font-family:inherit;">
    <input type="password" name="password" placeholder="Password" required
      style="background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:0.8rem; border-radius:6px; font-family:inherit;">
    <button type="submit" class="links" style="background:var(--accent); border:none; color:#0d1117; font-weight:bold; padding:0.8rem; border-radius:6px; cursor:pointer; font-family:inherit;">Login</button>
  </form>
</div>
{% endblock %}
